<!-- EmailJS template #1: notification to YOU
     Settings in EmailJS:
       Subject:   New enquiry from {{name}}: {{project_type}}
       To Email:  fahadriazcs@gmail.com
       From Name: Portfolio Website
       Reply To:  {{email}}
     Paste everything below into the template's content (use the "<>" code view). -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f1;padding:24px 0;font-family:Arial,Helvetica,sans-serif;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e4e4df;">
      <tr><td style="background:#1b1b19;padding:22px 28px;">
        <p style="margin:0;color:#ed4b7b;font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">New project enquiry</p>
        <p style="margin:6px 0 0;color:#f5f5f1;font-size:22px;font-weight:bold;">{{name}} wants to talk about a {{project_type}}</p>
      </td></tr>
      <tr><td style="padding:24px 28px 8px;">
        <table width="100%" cellpadding="0" cellspacing="0" style="font-size:14px;color:#1b1b19;">
          <tr><td style="padding:9px 0;border-bottom:1px solid #eeede8;color:#8b8b83;width:130px;">Name</td><td style="padding:9px 0;border-bottom:1px solid #eeede8;font-weight:bold;">{{name}}</td></tr>
          <tr><td style="padding:9px 0;border-bottom:1px solid #eeede8;color:#8b8b83;">Email</td><td style="padding:9px 0;border-bottom:1px solid #eeede8;"><a href="mailto:{{email}}" style="color:#1b1b19;">{{email}}</a></td></tr>
          <tr><td style="padding:9px 0;border-bottom:1px solid #eeede8;color:#8b8b83;">Phone</td><td style="padding:9px 0;border-bottom:1px solid #eeede8;">{{phone}}</td></tr>
          <tr><td style="padding:9px 0;border-bottom:1px solid #eeede8;color:#8b8b83;">Company</td><td style="padding:9px 0;border-bottom:1px solid #eeede8;">{{company}}</td></tr>
          <tr><td style="padding:9px 0;border-bottom:1px solid #eeede8;color:#8b8b83;">Needs</td><td style="padding:9px 0;border-bottom:1px solid #eeede8;">{{project_type}}</td></tr>
          <tr><td style="padding:9px 0;border-bottom:1px solid #eeede8;color:#8b8b83;">Budget</td><td style="padding:9px 0;border-bottom:1px solid #eeede8;">{{budget}}</td></tr>
          <tr><td style="padding:9px 0;border-bottom:1px solid #eeede8;color:#8b8b83;">Timeline</td><td style="padding:9px 0;border-bottom:1px solid #eeede8;">{{timeline}}</td></tr>
        </table>
        <p style="margin:22px 0 8px;color:#8b8b83;font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">Message</p>
        <p style="margin:0;padding:14px 16px;background:#f5f5f1;border-radius:8px;font-size:14px;line-height:1.6;color:#1b1b19;white-space:pre-line;">{{message}}</p>
      </td></tr>
      <tr><td style="padding:20px 28px 26px;">
        <a href="mailto:{{email}}" style="display:inline-block;padding:12px 22px;background:#1b1b19;color:#ffffff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:bold;">Reply to {{name}}</a>
        <p style="margin:16px 0 0;color:#8b8b83;font-size:12px;">Sent {{submitted_at}} from {{page_url}}</p>
      </td></tr>
    </table>
  </td></tr>
</table>
